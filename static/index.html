<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turbli GPS</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app panel-collapsed">
      <section class="map-shell">
        <div id="map" class="map">
          <div id="mapPlane" class="map-plane">
            <div id="worldLayer" class="world-layer">
              <div id="gridBackground" class="grid-background" hidden></div>
              <canvas id="gridCanvas" class="grid-canvas" hidden></canvas>
              <img id="overlayImage" class="overlay-image" alt="">
              <svg id="mapSvg" class="map-svg outline-svg" viewBox="0 0 1000 620" aria-label="Map outline"></svg>
              <svg id="routeSvg" class="map-svg route-svg" viewBox="0 0 1000 620" aria-label="Flight route"></svg>
              <div id="accuracyRing" class="accuracy-ring" hidden></div>
              <div id="altitudeRing" class="altitude-ring" hidden></div>
            </div>
          </div>
          <div id="positionDot" class="position-dot" hidden></div>
          <div id="pasteHint" class="paste-hint">Paste, drop, or upload a Turbli image</div>
        </div>
      </section>

      <aside id="panel" class="panel">
        <div class="panel-rail" aria-label="Map tools">
          <button id="panelHandle" class="panel-handle" type="button" aria-label="Toggle controls" title="Toggle controls">☰</button>
          <button id="modeToggle" class="mode-toggle icon-button" type="button" aria-label="Move canvas" title="Move canvas">↔️</button>
          <button id="locateButton" class="gps-toggle icon-button" type="button" aria-label="Start GPS" title="Start GPS">🧭</button>
          <button id="fitButton" class="icon-button" type="button" aria-label="Reset map" title="Reset map">🔄</button>
          <button id="turbliFetchButton" class="icon-button" type="button" aria-label="Fetch latest Turbli image" title="Fetch latest Turbli image">☁️</button>
          <button id="uploadButton" class="icon-button" type="button" aria-label="Paste or upload image" title="Paste or upload image">📋</button>
          <button id="autofitButton" class="icon-button" type="button" aria-label="Autofit outlines to image" title="Autofit outlines to image">🎯</button>
          <input id="uploadInput" class="visually-hidden" type="file" accept="image/*">
        </div>
        <div class="panel-content">

        <fieldset>
          <legend>GPS</legend>
          <div class="panel-grid">
            <div class="wide"><span>Lat, Lon</span><button id="coordValue" class="copy-value" type="button" title="Copy coordinates">--</button></div>
            <div class="wide"><span>Altitude</span><strong id="altitudeValue">--</strong></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Turbli Source</legend>
          <div class="controls">
            <label>Region
              <select id="regionSelect">
                <option value="us">United States</option>
                <option value="europe">Europe</option>
                <option value="asia">Asia</option>
                <option value="natl">North Atlantic</option>
                <option value="world">World</option>
                <option value="route">Route</option>
              </select>
            </label>
            <label>Route
              <input id="routeInput" type="text" placeholder="SEA-MUC" autocomplete="off" spellcheck="false" autocapitalize="characters">
            </label>
            <label>Data
              <select id="fetchKindSelect">
                <option value="grid">Turbulence grid (any region)</option>
                <option value="image">Map image (US, Europe, World)</option>
              </select>
            </label>
            <label>Altitude
              <select id="altitudeFetchSelect">
                <option value="15000">15,000 ft</option>
                <option value="20000">20,000 ft</option>
                <option value="25000">25,000 ft</option>
                <option value="30000">30,000 ft</option>
                <option value="33000" selected>33,000 ft</option>
                <option value="36000">36,000 ft</option>
                <option value="39000">39,000 ft</option>
              </select>
            </label>
            <label>Forecast
              <select id="leadFetchSelect">
                <option value="0">Now</option>
                <option value="3">+3 h</option>
                <option value="6">+6 h</option>
                <option value="9">+9 h</option>
                <option value="12">+12 h</option>
                <option value="15">+15 h</option>
                <option value="18">+18 h</option>
                <option value="21">+21 h</option>
                <option value="24">+24 h</option>
              </select>
            </label>
          </div>
        </fieldset>

        <details class="meta">
          <summary>Image details</summary>
          <div><span>Source</span><button id="sourceValue" class="copy-value" type="button" title="Copy source URL">None</button></div>
          <div><span>Scraped</span><strong id="scrapeValue">--</strong></div>
          <div><span>Forecast</span><strong id="forecastValue">--</strong></div>
          <div><span>Altitude</span><strong id="sourceAltitudeValue">--</strong></div>
        </details>

        <fieldset>
          <legend>View</legend>
          <div class="controls">
            <label>Turbulence <input id="opacityInput" type="range" min="0" max="1" value="0.72" step="0.01" title="Opacity of the turbulence grid or map image"></label>
            <label>Background <input id="backgroundInput" type="range" min="0" max="1" value="0" step="0.01" title="White background under the turbulence grid, as on turbli.com"></label>
            <label>Wireframe <input id="wireframeInput" type="range" min="0" max="3" value="0.75" step="0.05"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Transform</legend>
          <div class="controls">
            <label>Scale <input id="scaleInput" type="range" min="0.1" max="4" value="1" step="0.01"></label>
            <label>Rotation <input id="rotationInput" type="range" min="-180" max="180" value="0" step="1"></label>
            <label>X <input id="xInput" type="number" value="0" step="1"></label>
            <label>Y <input id="yInput" type="number" value="0" step="1"></label>
            <button id="resetImageButton" type="button" title="Reset image position and scale">↩ Reset image</button>
          </div>
        </fieldset>

        <output id="statusLine">Ready</output>
        </div>
      </aside>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/geo.js"></script>
    <script src="/grid.js"></script>
    <script src="/autofit.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
